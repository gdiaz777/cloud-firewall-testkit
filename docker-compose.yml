# Firewall Testkit — host networking: tests leave from the host's workload IP and cross the security solution.
#   Test server (one host):        docker compose --profile server up -d      → http://<server IP>/portal/
#   Client (each environment):     SERVER=<server IP> docker compose --profile client up -d
#   One-off CLI run from a client: SERVER=<server IP> docker compose run --rm client run IPS-01 TLS-05
services:
  server:
    image: ${TESTKIT_IMAGE:-ghcr.io/gdiaz777/cloud-firewall-testkit:latest}
    profiles: ["server"]
    command: ["server"]
    network_mode: host
    restart: unless-stopped
    environment:
      - SERVER_IP=${SERVER_IP:-}        # optional: IP to publish (auto-detected)
    volumes:
      - testkit-data:/data             # configuration, runs, reports and the generated testkit CA
  client:
    image: ${TESTKIT_IMAGE:-ghcr.io/gdiaz777/cloud-firewall-testkit:latest}
    profiles: ["client"]
    command: ["client"]
    network_mode: host
    cap_add: [NET_RAW, NET_ADMIN]
    restart: unless-stopped
    environment:
      - SERVER=${SERVER:?set SERVER=<test server IP>}
      - TESTKIT_ENV=${TESTKIT_ENV:-}   # optional: environment name (default: host name)
      - SRC_IP=${SRC_IP:-}             # optional: source IP for the tests (default: the one routed to the server)
volumes:
  testkit-data:
