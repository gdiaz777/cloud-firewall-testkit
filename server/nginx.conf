# Test server nginx (host network). Certificates are generated at start-up in /run/testkit.
user www-data;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /run/nginx.pid;
events { worker_connections 16384; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /var/log/nginx/access.log;
  sendfile on;
  keepalive_timeout 65;
  keepalive_requests 1000;
  server_tokens off;
  ssl_protocols TLSv1.2 TLSv1.3;

  server {
    listen 80 default_server;
    include /opt/testkit/server/nginx-locations.conf;
    # Portal (main server only; agents use /portal/api/agent/*)
    location /portal/ { proxy_pass http://127.0.0.1:8000/; proxy_read_timeout 90s; client_max_body_size 50m; proxy_buffering off; }
  }
  server {
    listen 443 ssl http2 default_server;
    server_name inspect.testkit.lab _;
    ssl_certificate /run/testkit/server.crt; ssl_certificate_key /run/testkit/server.key;
    include /opt/testkit/server/nginx-locations.conf;
  }
  server {
    listen 443 ssl http2;
    server_name nodecrypt.testkit.lab;
    ssl_certificate /run/testkit/server.crt; ssl_certificate_key /run/testkit/server.key;
    include /opt/testkit/server/nginx-locations.conf;
  }
  server {
    listen 443 ssl http2;
    server_name mtls.testkit.lab;
    ssl_certificate /run/testkit/server.crt; ssl_certificate_key /run/testkit/server.key;
    ssl_client_certificate /run/testkit/testkit_ca.crt;
    ssl_verify_client on;
    include /opt/testkit/server/nginx-locations.conf;
  }
}
