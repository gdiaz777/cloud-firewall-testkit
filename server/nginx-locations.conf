root /srv/www;
index index.html;
client_max_body_size 100m;
location = /upload { proxy_pass http://127.0.0.1:8001; }
location = /whoami { default_type text/plain; return 200 "remote_addr=$remote_addr via=$http_via xff=$http_x_forwarded_for\n"; }
location /demo/gz/ { default_type text/plain; add_header Content-Encoding gzip; }
# "Application" paths: served by a sink that reads the whole body before answering (like a real app). An nginx
# "return" would answer before the body arrives and the client would see the response before the firewall verdict.
location ~ ^/(cgi-bin|api|app|mgmt|vpn|vendor|search|profile|download\.php|index\.php|login\.php) { proxy_pass http://127.0.0.1:8001; }
location / { try_files $uri $uri/ =404; }
